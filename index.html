<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 CRM · Etapa 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../branding/colors_and_type.css" />
  <link rel="stylesheet" href="../branding/app.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <div class="nav__brand">
        <img src="../branding/assets/logo-white.png" alt="ProfesIA" />
        <span class="nav__mod">05 · CRM</span>
      </div>
      <div class="nav__right">
        <span class="badge">Etapa 1</span>
        <button type="button" id="btnNuevo">Nuevo lead</button>
      </div>
    </div>
    <div class="nav__bar"></div>
  </nav>
  <header class="page-head">
    <h1>Seguimiento comercial / CRM</h1>
    <p>Arrastrá las tarjetas · ABM de leads</p>
  </header>

  <main>
    <p class="leyenda">Nuevo → Contactado → Interesado → Esperando respuesta → Cerrado / Perdido</p>
    <section class="kanban" id="tablero"></section>
  </main>

  <dialog class="modal" id="modal">
    <form id="formAbm">
      <h2 id="modalTitulo">Nuevo lead</h2>
      <input type="hidden" id="editId" />
      <label>Nombre / empresa <input type="text" id="nombre" required /></label>
      <label>Origen
        <select id="origen">
          <option>Instagram</option>
          <option>WhatsApp</option>
          <option>Web</option>
          <option>Referido</option>
          <option>Feria</option>
        </select>
      </label>
      <label>Detalle <input type="text" id="detalle" required /></label>
      <label>Etapa
        <select id="etapa">
          <option value="nuevo">Nuevo</option>
          <option value="contactado">Contactado</option>
          <option value="interesado">Interesado</option>
          <option value="esperando">Esperando respuesta</option>
          <option value="cerrado">Cerrado / Perdido</option>
        </select>
      </label>
      <div class="modal-acciones">
        <button type="submit">Guardar</button>
        <button type="button" class="ghost" id="btnCancelar">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
